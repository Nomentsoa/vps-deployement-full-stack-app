server {
    listen 80;
    server_name lazanomentsoa.tech www.lazanomentsoa.tech;

    return 301 https://$host$request_uri;
}


server {



    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot

    server_name lazanomentsoa.tech www.lazanomentsoa.tech; # managed by Certbot

    ssl_certificate /etc/letsencrypt/live/lazanomentsoa.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lazanomentsoa.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




    # Serve the React app
    location / {
       root /usr/share/nginx/html;
       index index.html;
       try_files $uri /index.html;
    }

    # Send API calls to the backend container
    location /api/ {
       proxy_pass http://backend:8080;
    }

    # Send health checks to the backend container
    location /actuator/health {
       proxy_pass http://backend:8080;
    }

 }



