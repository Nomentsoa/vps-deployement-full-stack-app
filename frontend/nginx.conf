# 1. Redirection automatique de HTTP vers HTTPS
server {
    listen 80;
    server_name lazanomentsoa.tech www.lazanomentsoa.tech;

    return 301 https://$host$request_uri;
}

# 2. Configuration HTTPS sécurisée
server {
    listen 443 ssl;
    server_name lazanomentsoa.tech www.lazanomentsoa.tech;

    # Chemins vers les certificats SSL (générés à l'étape suivante)
    ssl_certificate /etc/letsencrypt/live/lazanomentsoa.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lazanomentsoa.tech/privkey.pem;

    # Sécurité SSL recommandée
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Serve the React app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Send API calls to the backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Send health checks to the backend container
    location /actuator/health {
        proxy_pass http://backend:8080;
    }
}
